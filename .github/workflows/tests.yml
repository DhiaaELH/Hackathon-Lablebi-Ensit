name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: pytest (embedded Postgres 16 + pgvector, LLM in demo mode)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: End-to-end (headless browser, every page x every role)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            e2e/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          pip install -r backend/requirements.txt -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix frontend

      - name: Start backend (demo data, no API keys)
        working-directory: backend
        run: |
          python -m app.seed --reset
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8000/api/system/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/system/health

      - name: Build and serve frontend (vite preview proxies /api to :8000)
        working-directory: frontend
        run: |
          npm run build
          nohup npx vite preview --port 4173 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:4173/api/system/health

      - name: Run E2E suite
        env:
          E2E_BASE_URL: http://localhost:4173
        run: python -m pytest e2e -q

      - name: Server logs
        if: failure()
        run: tail -n 200 backend.log frontend.log

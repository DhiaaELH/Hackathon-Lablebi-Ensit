<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LessonForge Orbit</title>
  <meta name="description" content="LessonForge — an interactive 3D presentation: ten AI agents orbiting your course, the full workflow, every feature, and how we keep LLM costs production-ready." />
  <meta name="theme-color" content="#07050f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b3fc4'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia' font-size='18' fill='white'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="labels-inner"></div>
  <div id="flash" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="#1" aria-label="LessonForge — first slide">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-text">LessonForge <span class="muted">· Orbit</span></span>
    </a>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      </div>
      <button type="button" class="icon-btn" id="exploreBtn" aria-pressed="false" title="Explore the system (E)">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(-20 12 12)"/></svg>
        <span class="lbl" data-ui="explore">Explore</span>
      </button>
      <button type="button" class="icon-btn" id="fsBtn" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="panel" class="panel" aria-live="polite">
    <article id="panelInner" class="panel-inner"></article>
  </main>

  <div id="explore-hint" class="explore-hint" hidden></div>
  <div id="core-badge" class="core-badge" aria-hidden="true"></div>
  <div id="biz" aria-hidden="true">
    <div class="ticker"><div class="track"></div></div>
    <div class="biz-hint"></div>
  </div>

  <nav class="bottom" aria-label="Slides">
    <button type="button" class="nav-btn" id="prevBtn" aria-label="Previous slide">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="progress" id="progress"></div>
    <span class="counter" id="counter">1 / 1</span>
    <button type="button" class="nav-btn primary" id="nextBtn" aria-label="Next slide">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="print" class="print-deck"></div>

  <noscript><div class="noscript">This presentation needs JavaScript. The source content is in <code>slides.js</code>.</div></noscript>
  <script type="module" src="main.js"></script>
</body>
</html>
